    <text x="18" y="155" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">targeted meta ads expert</text>
    <text x="18" y="172" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Vol: 9.8K • CPC: $4.10</text>
    <rect x="145" y="148" width="34" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="162" y="161" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">LOW</text>

    <!-- Row 4 -->
