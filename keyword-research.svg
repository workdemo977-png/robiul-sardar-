    <rect x="145" y="198" width="34" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="162" y="211" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">LOW</text>
