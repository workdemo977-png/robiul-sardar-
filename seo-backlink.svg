  <line x1="422" y1="102" x2="426" y2="102" stroke="#34d399" stroke-width="1.5"/>
  <text x="446" y="96" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Authority Index</text>
  <text x="446" y="112" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">High PR Referral</text>

