    <circle cx="20" cy="17" r="6" stroke="#60a5fa" stroke-width="1.5" fill="none"/>
    <line x1="25" y1="21" x2="30" y2="26" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
