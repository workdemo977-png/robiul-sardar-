<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="igBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#1f1837" />
    </linearGradient>
    <linearGradient id="brandPinkOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="igPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="igShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" rx="16" fill="url(#igBg)" />
  <rect x="1" y="1" width="598" height="398" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Left: Stylized Mobile / Content Post Mockup -->
  <g transform="translate(45, 35)" filter="url(#igShadow)">
    <rect width="240" height="330" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Phone Top Speaker/Sensor -->
    <rect x="95" y="8" width="50" height="4" rx="2" fill="#334155" />

    <!-- Profile Header in Post -->
    <circle cx="36" cy="38" r="14" fill="url(#brandPinkOrange)" stroke="#0f172a" stroke-width="2"/>
    <text x="58" y="36" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">modern.business</text>
    <text x="58" y="49" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Strategic Growth • Viral Reach</text>

    <!-- Post Visual Grid -->
    <rect x="16" y="64" width="208" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    
    <!-- Visual Art inside post -->
    <circle cx="120" cy="130" r="42" fill="url(#brandPinkOrange)" fill-opacity="0.2"/>
    <path d="M 85 145 C 95 110 135 105 155 130" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="155" cy="130" r="5" fill="#f43f5e"/>
    <rect x="30" y="78" width="80" height="18" rx="9" fill="#0f172a" fill-opacity="0.8"/>
    <text x="70" y="90" text-anchor="middle" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">CAROUSEL GUIDE</text>

    <!-- Action Bar (Likes, Comments, Shares, Saves) -->
    <g transform="translate(18, 224)">
      <!-- Heart -->
      <path d="M 10 7 C 8 2 2 3 2 8 C 2 13 10 17 10 17 C 10 17 18 13 18 8 C 18 3 12 2 10 7 Z" fill="#f43f5e" />
      <text x="24" y="14" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">2,480</text>

      <!-- Comment Bubble -->
      <path d="M 68 5 C 63 5 59 8.5 59 13 C 59 15 60 17 62 18.5 L 61 22 L 65 20 C 66 20.5 67 21 68 21 C 73 21 77 17.5 77 13 C 77 8.5 73 5 68 5 Z" stroke="#cbd5e1" stroke-width="1.3" fill="none"/>
      <text x="82" y="14" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10">184</text>

      <!-- Share Arrow -->
      <path d="M 118 6 L 129 11 L 118 16 L 121 12 L 113 12 C 109 12 107 14 107 17" stroke="#cbd5e1" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Bookmark Ribbon -->
      <path d="M 195 5 L 205 5 L 205 18 L 200 14 L 195 18 Z" fill="#ec4899"/>
    </g>

    <!-- Post Caption Teaser -->
    <rect x="18" y="254" width="180" height="8" rx="4" fill="#334155"/>
    <rect x="18" y="270" width="130" height="8" rx="4" fill="#334155"/>
    <text x="18" y="298" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9">#brandstrategy #socialmediamarketing #growth</text>
  </g>

  <!-- Right Side: Organic Growth Analytics & Engagement Cards -->
  <g transform="translate(315, 45)">
    <!-- Main Growth Overview Card -->
    <rect width="250" height="150" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="18" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Account Engagement &amp; Reach</text>

    <!-- High-level Metric -->
    <text x="18" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Non-Follower Reach</text>
    <text x="18" y="88" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800">84.6%</text>
    <rect x="135" y="70" width="100" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
    <text x="185" y="85" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">+312% Growth</text>

    <!-- Progress Indicator Bar -->
    <rect x="18" y="108" width="214" height="8" rx="4" fill="#0f172a"/>
    <rect x="18" y="108" width="180" height="8" rx="4" fill="url(#brandPinkOrange)"/>

    <text x="18" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Explore page &amp; Reels algorithmic distribution</text>
  </g>

  <g transform="translate(315, 215)">
    <!-- Follower Retention Card -->
    <rect width="120" height="145" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="14" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Profile Visits</text>
    <text x="14" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">14.8K</text>
    <text x="14" y="72" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">▲ Organic</text>
    <path d="M 14 110 L 35 102 L 55 106 L 75 92 L 95 80" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="95" cy="80" r="3" fill="#f43f5e"/>
    <text x="14" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Active Weekly</text>

    <!-- Bio Link Clicks Card -->
    <rect x="130" y="0" width="120" height="145" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="144" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Link In Bio Clicks</text>
    <text x="144" y="52" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">1,940</text>
    <text x="144" y="72" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">High Converting</text>
    <path d="M 144 112 L 165 108 L 185 96 L 205 92 L 225 78" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="225" cy="78" r="3" fill="#a855f7"/>
    <text x="144" y="132" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Inquiry Pipeline</text>
  </g>
</svg>
