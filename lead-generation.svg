<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="leadBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="100%" stop-color="#14233c" />
    </linearGradient>
    <linearGradient id="funnelTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="funnelMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="funnelBottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="leadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="400" rx="16" fill="url(#leadBg)" />
  <rect x="1" y="1" width="598" height="398" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Left: The Visual Lead Funnel -->
  <g transform="translate(45, 50)">
    <!-- Top Layer: Prospects / Market Reach -->
    <path d="M 10 20 L 230 20 L 205 75 L 35 75 Z" fill="url(#funnelTop)" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="44" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">1. PROSPECTS &amp; TARGET AUDIENCE</text>
    <text x="120" y="60" text-anchor="middle" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Total Reach: 15,000 Verified Profiles</text>

    <!-- Connector arrows -->
    <path d="M 120 78 L 120 90" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Middle Layer: Qualified Leads -->
    <path d="M 40 92 L 200 92 L 175 155 L 65 155 Z" fill="url(#funnelMid)" fill-opacity="0.9" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="120" y="118" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">2. FILTERED &amp; QUALIFIED (MQL)</text>
    <text x="120" y="136" text-anchor="middle" fill="#ede9fe" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">High Intent • Decision Makers</text>

    <!-- Connector arrows -->
    <path d="M 120 158 L 120 170" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Layer: Hot Conversion Leads -->
    <path d="M 70 172 L 170 172 L 150 238 L 90 238 Z" fill="url(#funnelBottom)" fill-opacity="0.95" stroke="#34d399" stroke-width="2" filter="url(#leadGlow)"/>
    <text x="120" y="198" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">3. HIGH CONVERSION</text>
    <text x="120" y="215" text-anchor="middle" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Ready to Buy / Book</text>

    <!-- Output Spout / Value Drop -->
    <rect x="85" y="250" width="70" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="120" y="271" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">✔ CLIENTS</text>
  </g>

  <!-- Right: Verified B2B / B2C Contact Cards & Verification Badges -->
  <g transform="translate(305, 45)">
    <!-- Header Badge -->
    <rect width="250" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="19" r="6" fill="#10b981"/>
    <text x="34" y="23" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Verified Direct Decision Makers</text>

    <!-- Contact Profile 1 -->
    <g transform="translate(0, 50)">
      <rect width="250" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="30" cy="37" r="18" fill="#3b82f6" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Silhouette avatar -->
      <circle cx="30" cy="32" r="6" fill="#38bdf8"/>
      <path d="M 21 47 C 21 41 39 41 39 47" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

      <text x="58" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Managing Director / CEO</text>
      <text x="58" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">E-Commerce &amp; Retail Brand</text>
      <text x="58" y="58" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">email: direct.ceo@brand.com</text>
      <rect x="185" y="14" width="55" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
      <text x="212" y="26" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">VERIFIED</text>
    </g>

    <!-- Contact Profile 2 -->
    <g transform="translate(0, 134)">
      <rect width="250" height="74" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="30" cy="37" r="18" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1.5"/>
      <circle cx="30" cy="32" r="6" fill="#a78bfa"/>
      <path d="M 21 47 C 21 41 39 41 39 47" stroke="#a78bfa" stroke-width="1.5" fill="none"/>

      <text x="58" y="27" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Head of Marketing &amp; Sales</text>
      <text x="58" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">B2B SaaS Technology</text>
      <text x="58" y="58" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">phone: +1 (555) 019-XXXX</text>
      <rect x="185" y="14" width="55" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
      <text x="212" y="26" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">VALIDATED</text>
    </g>

    <!-- Lead Data Metrics Card -->
    <g transform="translate(0, 218)">
      <rect width="250" height="80" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="25" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Data Quality Metrics</text>
      
      <text x="14" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Email Deliverability</text>
      <text x="14" y="65" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">98.4%</text>

      <line x1="120" y1="36" x2="120" y2="70" stroke="#334155"/>

      <text x="135" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Zero Bounce Rate</text>
      <text x="135" y="65" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">Clean List</text>
    </g>
  </g>
</svg>
